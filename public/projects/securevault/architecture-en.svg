<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Password vault architecture — FastAPI Clean Architecture, AES-256-GCM encryption boundary before MongoDB">
  <style>
    .bg{fill:#0e0e10}
    .card{fill:#16161a;stroke:#2c2c32;stroke-width:1.5}
    .hi{fill:#1c1c22;stroke:#6a6a74;stroke-width:2}
    .ey{font:600 22px ui-monospace,'DM Mono',monospace;fill:#6f6f78;letter-spacing:2px}
    .eyw{font:600 22px ui-monospace,'DM Mono',monospace;fill:#dcdce2;letter-spacing:2px}
    .mn{font:400 27px ui-monospace,'DM Mono',monospace;fill:#e6e6ea}
    .sb{font:400 21px ui-monospace,'DM Mono',monospace;fill:#9a9aa2}
    .nt{font:400 20px ui-monospace,'DM Mono',monospace;fill:#7a7a82}
    .tt{font:600 24px ui-monospace,'DM Mono',monospace;fill:#8a8a92;letter-spacing:3px}
    .ar{stroke:#3c3c42;stroke-width:1.5}
  </style>
  <rect class="bg" width="1600" height="1000"/>
  <text class="tt" x="90" y="64">ARCHITECTURE · PASSWORD VAULT</text>

  <rect class="card" x="90" y="100" width="1420" height="140" rx="12"/>
  <text class="ey" x="122" y="150">INTERFACE</text>
  <text class="mn" x="122" y="196">Vue 3 · Vuetify · TypeScript · Pinia</text>
  <text class="nt" x="1480" y="196" text-anchor="end">reads &amp; writes, never protects</text>

  <line class="ar" x1="800" y1="248" x2="800" y2="286"/>
  <polygon points="790,282 810,282 800,294" fill="#3c3c42"/>
  <text class="nt" x="822" y="278">REST /api/v1 · JWT access + refresh</text>

  <rect class="card" x="90" y="294" width="1420" height="430" rx="12"/>
  <text class="ey" x="122" y="344">API · FASTAPI — CLEAN ARCHITECTURE</text>
  <text x="122" y="392" style="font:400 25px ui-monospace,monospace;fill:#d8d8de">api  →  application  →  domain  →  infrastructure</text>

  <rect class="card" x="122" y="428" width="600" height="150" rx="10"/>
  <text class="eyw" x="152" y="470">CORE · SECURITY</text>
  <text class="sb" x="152" y="506">Argon2id · TOTP 2FA</text>
  <text class="sb" x="152" y="538">rate-limiting · anti-brute-force · audit</text>

  <rect class="hi" x="742" y="428" width="740" height="150" rx="10"/>
  <text class="eyw" x="772" y="470">ENCRYPTION BOUNDARY</text>
  <text class="sb" x="772" y="506">AES-256-GCM applied before persistence</text>
  <text class="sb" x="772" y="538">versioned master key · never exposed to the client</text>

  <text class="nt" x="122" y="648">Nothing reaches the store in clear · repositories via domain interfaces</text>

  <line class="ar" x1="800" y1="724" x2="800" y2="766"/>
  <polygon points="790,762 810,762 800,774" fill="#3c3c42"/>

  <rect class="card" x="90" y="774" width="1420" height="120" rx="12"/>
  <text class="ey" x="122" y="822">DATA</text>
  <text class="mn" x="122" y="864">MongoDB — stores only encrypted entries</text>

  <text class="nt" x="90" y="958">DELIVERY · Docker Compose · GitLab CI (lint → types → tests → build) · pre-commit</text>
</svg>
