<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Architecture de la plateforme de tirages — API Node/Express en couches, moteur provably-fair, MongoDB et Redis">
  <style>
    .bg{fill:#0e0e10}
    .card{fill:#16161a;stroke:#2c2c32;stroke-width:1.5}
    .hi{fill:#1c1c22;stroke:#6a6a74;stroke-width:2}
    .ey{font:600 22px ui-monospace,'DM Mono',monospace;fill:#6f6f78;letter-spacing:2px}
    .eyw{font:600 22px ui-monospace,'DM Mono',monospace;fill:#dcdce2;letter-spacing:2px}
    .mn{font:400 27px ui-monospace,'DM Mono',monospace;fill:#e6e6ea}
    .sb{font:400 21px ui-monospace,'DM Mono',monospace;fill:#9a9aa2}
    .nt{font:400 20px ui-monospace,'DM Mono',monospace;fill:#7a7a82}
    .tt{font:600 24px ui-monospace,'DM Mono',monospace;fill:#8a8a92;letter-spacing:3px}
    .ar{stroke:#3c3c42;stroke-width:1.5}
  </style>
  <rect class="bg" width="1600" height="1000"/>
  <text class="tt" x="90" y="64">ARCHITECTURE · TIRAGES EN LIGNE</text>

  <rect class="card" x="90" y="100" width="1420" height="140" rx="12"/>
  <text class="ey" x="122" y="150">INTERFACE</text>
  <text class="mn" x="122" y="196">Vue 3 · Vuetify · TypeScript · Pinia · i18n</text>
  <text class="nt" x="1480" y="196" text-anchor="end">espace joueur &amp; back-office</text>

  <line class="ar" x1="800" y1="248" x2="800" y2="286"/>
  <polygon points="790,282 810,282 800,294" fill="#3c3c42"/>
  <text class="nt" x="822" y="278">REST · JWT access / refresh</text>

  <rect class="card" x="90" y="294" width="1420" height="430" rx="12"/>
  <text class="ey" x="122" y="344">API · NODE.JS · EXPRESS · TYPESCRIPT</text>
  <text x="122" y="392" style="font:400 24px ui-monospace,monospace;fill:#d8d8de">Middleware (auth · Zod · rate-limit)  →  Controller  →  Service  →  Repository</text>

  <rect class="hi" x="122" y="430" width="1360" height="152" rx="10"/>
  <text class="eyw" x="152" y="472">MOTEUR DE TIRAGE — PROVABLY-FAIR</text>
  <text class="sb" x="152" y="508">commit-reveal · HMAC-SHA256 · graine engagée puis révélée</text>
  <text class="sb" x="152" y="540">rejouable et vérifiable par le joueur, sans confiance dans l'organisateur</text>

  <text class="nt" x="122" y="648">Injection de dépendances (container) · montants stockés en centimes entiers</text>

  <line class="ar" x1="800" y1="724" x2="800" y2="766"/>
  <polygon points="790,762 810,762 800,774" fill="#3c3c42"/>

  <rect class="card" x="90" y="774" width="1420" height="120" rx="12"/>
  <text class="ey" x="122" y="822">DONNÉES</text>
  <text class="mn" x="122" y="864">MongoDB / Mongoose  ·  Redis — cache &amp; rate-limiting distribué</text>

  <text class="nt" x="90" y="958">LIVRAISON · Docker Compose · Travis CI (lint · typecheck · test · build) · Jest · Vitest · Playwright</text>
</svg>
