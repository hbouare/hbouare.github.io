<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Architecture de Pilotis — monolithe modulaire FastAPI par domaines, base PostgreSQL">
  <style>
    .bg{fill:#0e0e10}
    .card{fill:#16161a;stroke:#2c2c32;stroke-width:1.5}
    .hi{fill:#1c1c22;stroke:#5a5a64;stroke-width:2}
    .ey{font:600 22px ui-monospace,'DM Mono',monospace;fill:#6f6f78;letter-spacing:2px}
    .eyw{font:600 22px ui-monospace,'DM Mono',monospace;fill:#dcdce2;letter-spacing:2px}
    .mn{font:400 27px ui-monospace,'DM Mono',monospace;fill:#e6e6ea}
    .sb{font:400 22px ui-monospace,'DM Mono',monospace;fill:#c2c2c9}
    .nt{font:400 20px ui-monospace,'DM Mono',monospace;fill:#7a7a82}
    .tt{font:600 24px ui-monospace,'DM Mono',monospace;fill:#8a8a92;letter-spacing:3px}
    .ar{stroke:#3c3c42;stroke-width:1.5}
  </style>
  <rect class="bg" width="1600" height="1000"/>
  <text class="tt" x="90" y="64">ARCHITECTURE · PILOTIS</text>

  <rect class="card" x="90" y="100" width="1420" height="140" rx="12"/>
  <text class="ey" x="122" y="150">INTERFACE</text>
  <text class="mn" x="122" y="196">Vue 3 · Vuetify · TypeScript · Pinia · i18n</text>

  <line class="ar" x1="800" y1="248" x2="800" y2="286"/>
  <polygon points="790,282 810,282 800,294" fill="#3c3c42"/>
  <text class="nt" x="822" y="278">REST /api/v1</text>

  <rect class="card" x="90" y="294" width="1420" height="430" rx="12"/>
  <text class="ey" x="122" y="344">API · FASTAPI — MONOLITHE MODULAIRE PAR DOMAINES</text>

  <rect class="hi" x="122" y="376" width="1360" height="150" rx="10"/>
  <text class="eyw" x="152" y="418">DOMAINES</text>
  <text class="sb" x="152" y="456">auth · finance · factures · alertes · imports</text>
  <text class="sb" x="152" y="490">rapports · recherche · catégories · organisations · users</text>

  <text x="122" y="588" style="font:400 25px ui-monospace,monospace;fill:#d8d8de">Chaque domaine  =  router  →  service  →  repository  →  modèle</text>
  <text class="nt" x="122" y="648">S'ajoute sans toucher aux fondations · socle commun : core · common · database</text>

  <line class="ar" x1="800" y1="724" x2="800" y2="766"/>
  <polygon points="790,762 810,762 800,774" fill="#3c3c42"/>

  <rect class="card" x="90" y="774" width="1420" height="120" rx="12"/>
  <text class="ey" x="122" y="822">DONNÉES</text>
  <text class="mn" x="122" y="864">PostgreSQL · UUID · horodatages UTC · migrations réversibles</text>

  <text class="nt" x="90" y="958">LIVRAISON · Docker Compose · GitLab CI (bloquante) · Ruff · Black · MyPy · pytest · Vitest · Playwright</text>
</svg>
